[package]
name = "omarchy-backup"
version = "0.1.0"
edition = "2024"
description = "rsync backup of an Omarchy Linux setup to an encrypted LUKS2+btrfs USB drive"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
nix = { version = "0.29", features = ["fs", "user", "process", "signal", "feature"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
